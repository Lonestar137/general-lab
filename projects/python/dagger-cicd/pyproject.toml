[project]
name = "dagger-cicd"
version = "0.1.0"
description = "Testing dagger cicd integration"
readme = "README.md"
authors = [
    { name = "Garrett Jones", email = "garretcj2010@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
dagger-cicd = "dagger_cicd:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dagger-io>=0.21.8",
    "pyrefly>=1.2.0",
    "ruff>=0.16.2",
]
