# ITAR-Compliant Ollama Deployment with Podman
# Secure LLM server with SSL proxy and isolated networking
#
# Usage:
#   1. Generate certificates: ./scripts/generate-certs.sh -d your-domain.local
#   2. Build nginx proxy: podman-compose build nginx-proxy
#   3. Start: podman-compose up -d
#   4. Access: https://localhost:8443
#
# Security Features:
#   - TLS 1.3 encryption
#   - Isolated internal network
#   - Optional authentication
#   - IP whitelist (network access control)
#   - GPU passthrough
#   - Non-root containers
#   - Read-only filesystems where possible

version: "3.9"

services:
  # Nginx SSL Proxy - Public-facing
  nginx-proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: ollama-proxy
    hostname: ollama-proxy
    restart: unless-stopped
    ports:
      - "${PROXY_HTTP_PORT:-8080}:80"
      - "${PROXY_HTTPS_PORT:-8443}:443"
    environment:
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      - AUTH_USER=${AUTH_USER:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - API_TOKEN=${API_TOKEN:-}
      - WHITELIST_ENABLED=${WHITELIST_ENABLED:-false}
      - WHITELIST_IPS=${WHITELIST_IPS:-}
      - TZ=${TZ:-UTC}
    volumes:
      # SSL certificates (required)
      - ./certs:/etc/nginx/ssl:ro,Z
      # Nginx logs (optional, for auditing)
      - ollama-nginx-logs:/var/log/nginx:Z
    networks:
      - ollama-internal
      - ollama-external
    depends_on:
      ollama:
        condition: service_healthy
    # Security options
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    read_only: false
    tmpfs:
      - /tmp:size=10M,mode=1777
      - /run:size=10M,mode=755
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "--no-check-certificate", "https://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Ollama LLM Server - Internal only (using official image)
  ollama:
    image: docker.io/ollama/ollama:${OLLAMA_VERSION:-0.5.13}
    container_name: ollama-server
    hostname: ollama
    restart: unless-stopped
    # No exposed ports - only accessible via internal network
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-24h}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-4}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-2}
      # Security: Disable external origins
      - OLLAMA_ORIGINS=
      # GPU Configuration
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      # Model storage (persistent)
      - ollama-models:/root/.ollama:Z
    networks:
      - ollama-internal
    # GPU passthrough configuration
    # Option 1: Using NVIDIA Container Toolkit CDI (recommended)
    # Requires: nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
    # devices:
    #   - nvidia.com/gpu=all
    #
    # Option 2: Direct device passthrough (fallback)
    # Uncomment the devices section below if CDI is not available
    # devices:
    #   - /dev/nvidia0:/dev/nvidia0
    #   - /dev/nvidiactl:/dev/nvidiactl
    #   - /dev/nvidia-uvm:/dev/nvidia-uvm
    #   - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
    #
    # Security options
    security_opt:
      - no-new-privileges:true
    # Resource limits
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEMORY_LIMIT:-32G}
        reservations:
          memory: ${OLLAMA_MEMORY_RESERVATION:-8G}
          # NVIDIA GPU reservation (requires nvidia-container-toolkit)
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  # Internal network - Ollama only accessible here
  ollama-internal:
    driver: bridge
    internal: true
    driver_opts:
      # Disable inter-container communication except explicit links
      com.docker.network.bridge.enable_icc: "false"
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1

  # External network - Nginx proxy only
  ollama-external:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"

volumes:
  # Persistent model storage
  ollama-models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${OLLAMA_MODELS_PATH:-./data/models}

  # Nginx logs for security auditing
  ollama-nginx-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${NGINX_LOGS_PATH:-./data/logs/nginx}
