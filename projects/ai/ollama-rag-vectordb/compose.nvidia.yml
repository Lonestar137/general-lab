# NVIDIA GPU Override for Ollama
# Use with: podman-compose -f podman-compose.yml -f compose.nvidia.yml up -d
#
# Prerequisites:
#   - NVIDIA GPU with driver installed
#   - NVIDIA Container Toolkit: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/
#
# For Podman, install and configure:
#   # Install nvidia-container-toolkit
#   sudo dnf install nvidia-container-toolkit   # Fedora/RHEL
#   sudo apt install nvidia-container-toolkit   # Debian/Ubuntu
#
#   # Generate CDI specification
#   sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
#
#   # Verify
#   nvidia-ctk cdi list

version: "3.9"

services:
  ollama:
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    # Device passthrough - choose ONE method:
    #
    # Method 1: CDI (Container Device Interface) - Recommended for Podman
    # Requires: nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
    devices:
      - nvidia.com/gpu=all
    #
    # Method 2: Direct device passthrough (fallback if CDI not available)
    # Uncomment below and comment out the CDI device above
    # devices:
    #   - /dev/nvidia0:/dev/nvidia0
    #   - /dev/nvidiactl:/dev/nvidiactl
    #   - /dev/nvidia-uvm:/dev/nvidia-uvm
    #   - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
    #   # Add more GPUs as needed:
    #   # - /dev/nvidia1:/dev/nvidia1
