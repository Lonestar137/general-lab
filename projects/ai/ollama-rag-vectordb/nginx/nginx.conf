# ITAR-Compliant Nginx Configuration for Ollama SSL Proxy
# Security-hardened configuration with TLS 1.3 and optional authentication

# Run as non-root user
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

# Security: Limit information exposure
server_tokens off;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # Basic settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with security audit fields
    log_format security '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        '$ssl_protocol/$ssl_cipher '
                        'rt=$request_time uct="$upstream_connect_time" '
                        'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log security;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Security: Limit request sizes for DoS protection
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # Security: Timeouts to prevent slowloris attacks
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;

    # Security: Rate limiting
    limit_req_zone $binary_remote_addr zone=ollama_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream Ollama server (internal network only)
    upstream ollama_backend {
        server ollama:11434;
        keepalive 32;
    }

    # IP Whitelist Configuration
    # This map is used for conditional access control
    # Generated dynamically by entrypoint script if WHITELIST_ENABLED=true
    geo $whitelist_status {
        default 0;
        # Whitelist entries will be included from external file
        include /etc/nginx/conf.d/ip-whitelist.conf*;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name _;
        
        # Security headers even for redirects
        add_header X-Content-Type-Options nosniff always;
        
        # Apply whitelist to HTTP redirects as well
        include /etc/nginx/conf.d/whitelist-check.conf*;
        
        return 301 https://$host$request_uri;
    }

    # HTTPS Server
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        # SSL Certificate Configuration
        ssl_certificate /etc/nginx/ssl/server-chain.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_trusted_certificate /etc/nginx/ssl/ca.crt;

        # ITAR-Compliant SSL Configuration
        # TLS 1.3 only (strongest security)
        ssl_protocols TLSv1.3;
        
        # Modern cipher suite for TLS 1.3
        ssl_ciphers TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256;
        ssl_prefer_server_ciphers off;

        # SSL Session Configuration
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # OCSP Stapling (for production with real certs)
        # ssl_stapling on;
        # ssl_stapling_verify on;

        # DH Parameters for Perfect Forward Secrecy
        ssl_dhparam /etc/nginx/ssl/dhparam.pem;

        # ECDH Curve
        ssl_ecdh_curve secp384r1;

        # Security Headers (ITAR/DoD compliance)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none';" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        
        # Remove server version headers
        more_clear_headers Server;
        more_clear_headers X-Powered-By;

        # Rate limiting
        limit_req zone=ollama_limit burst=20 nodelay;
        limit_conn conn_limit 10;

        # IP Whitelist enforcement (if enabled)
        # Denies all traffic not on whitelist before any other processing
        include /etc/nginx/conf.d/whitelist-check.conf*;

        # Optional Authentication (enabled via environment variable)
        # Auth file is generated at container startup if AUTH_ENABLED=true
        # include /etc/nginx/conf.d/auth.conf;

        # Health check endpoint (no auth required, but whitelist still applies)
        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Ollama API proxy
        location / {
            # Include auth configuration if it exists
            include /etc/nginx/conf.d/auth.conf*;

            proxy_pass http://ollama_backend;
            
            # Proxy headers
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # Timeouts for long-running LLM requests
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            
            # Buffering for large responses
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
            
            # WebSocket support (for streaming)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Block sensitive paths
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
